name: CI - Test Installation & Simulation Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Ubuntu Test (CalculiX + Gmsh + build123d)
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (CalculiX, Gmsh, OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            calculix-ccx \
            gmsh \
            python3-gmsh \
            libglu1-mesa \
            libgl1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Tool Versions
        run: |
          echo "=== CalculiX ==="
          ccx -v || true
          echo "=== Gmsh ==="
          gmsh --version || true
          echo "=== Python & build123d ==="
          python -c "import build123d; print('build123d:', build123d.__version__)"

      - name: Run Test Suite
        run: |
          python -m unittest tests/test_installation.py -v

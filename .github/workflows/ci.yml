name: CI - Test Installation & Simulation Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Ubuntu Test (CalculiX + Gmsh + build123d)
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (CalculiX, Gmsh, OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            calculix-ccx \
            gmsh \
            python3-gmsh \
            libglu1-mesa \
            libgl1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Enable system Gmsh in Python
        run: |
          PYTHON_SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "Linking /usr/lib/python3/dist-packages/gmsh.py -> $PYTHON_SITE/gmsh.py"
          ln -sf /usr/lib/python3/dist-packages/gmsh.py "$PYTHON_SITE/gmsh.py"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Tool Versions
        run: |
          echo "=== CalculiX ==="
          ccx -v || true
          echo "=== Gmsh CLI ==="
          gmsh --version || true
          echo "=== Python Modules ==="
          python -c "import gmsh; print('gmsh Python version:', gmsh.__version__)"
          python -c "import build123d; print('build123d Python version:', build123d.__version__)"

      - name: Run Test Suite
        run: |
          python -m unittest discover tests -v
